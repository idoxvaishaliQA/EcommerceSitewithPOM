stages:
  - test

playwright:
  stage: test
  # Image version must match @playwright/test in package.json
  image: mcr.microsoft.com/playwright:v1.56.0-noble
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
  script:
    - npm ci
    - npm run test:ci
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - playwright-report/
      - test-results/
    reports:
      junit: results.xml
